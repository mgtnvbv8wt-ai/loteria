<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#821416">
  <title>Decims i Numeros</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lotería">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // Carga siempre la última versión: pregunta la versión sin usar caché y la añade a los archivos
    (function () {
      function load(v) {
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'style.css?v=' + v; document.head.appendChild(l);
        var s = document.createElement('script'); s.src = 'app.js?v=' + v; document.body.appendChild(s);
      }
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); }).then(function (j) { load(j.v); })
        .catch(function () { load('0'); });
    })();
  </script>
</body>
</html>
